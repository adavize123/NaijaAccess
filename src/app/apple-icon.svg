<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="180" height="180">
  <title>NaijaAccess</title>

  <!-- Rounded square in the brand navy. Solid fill keeps the mark legible
       at 16px, where an outline would break up. -->
  <rect width="32" height="32" rx="7" fill="#14304F"/>

  <!-- The letter N, drawn as three strokes rather than set as type, so it
       stays crisp at favicon sizes and needs no font to load. -->
  <path d="M8.5 22.5V9.5l12 12v-12"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3.2"
        stroke-linecap="square"
        stroke-linejoin="miter"/>

  <!-- A single braille dot, clear of the letterform. Reads as a full stop at
       16px and as a deliberate mark at larger sizes. Amber picks up the
       accent colour used for warnings in the interface. -->
  <circle cx="24.5" cy="23" r="3.1" fill="#F0A02A"/>
</svg>
