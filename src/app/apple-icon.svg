<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="180" height="180">
  <title>NaijaAccess</title>

  <!-- Rounded square in the brand navy. Solid fill keeps the mark readable at
       16px, where an outlined mark breaks up. -->
  <rect width="180" height="180" rx="7" fill="#14304F"/>

  <!-- An open door, seen from the front: the frame on three sides, and the
       door itself swung clear to the left so the opening is unobstructed.
       Access here means a way through that is genuinely open, which is the
       distinction the scorecard measures. Two shapes, no text, and the
       silhouette survives being scaled to a favicon. -->

  <!-- Frame: left post, head, right post -->
  <path d="M8 25V8h16v17"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.4"
        stroke-linecap="square"
        stroke-linejoin="miter"/>

  <!-- The opening, filled to read as depth rather than outline -->
  <path d="M14 25V11h10v14z" fill="#FFFFFF" opacity="0.16"/>

  <!-- The door, standing open at an angle -->
  <path d="M14 11 8 13v12l6-2z"
        fill="#F0A02A"/>

  <!-- Threshold -->
  <path d="M5 25h22"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.4"
        stroke-linecap="round"/>
</svg>
